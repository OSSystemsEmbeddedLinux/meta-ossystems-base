# oelint-adv defaults for this layer. Auto-loaded when oelint-adv runs with this
# directory as the working directory (see contrib/oelint/run-oelint.sh).
#
# Layer-wide suppressions:
#   * oelint.var.bbclassextend: every recipe in this layer is target-only, so the
#     "add BBCLASSEXTEND" suggestion never applies and would otherwise need a
#     redundant inline comment on every single recipe.
#   * oelint.var.licenseremotefile: recipes whose only sources are files from
#     this layer have no upstream license file to check, so they point
#     LIC_FILES_CHKSUM at ${COMMON_LICENSE_DIR}, as OE-Core does for its own
#     such recipes. Recipes that fetch a source must still checksum its license.
# All other exceptions stay inline as '# nooelint: <rule.id>' comments next to
# the finding, so new recipes are always fully linted and each exception is
# documented in place.
[oelint]
release = blacksail
suppress =
    oelint.var.bbclassextend
    oelint.var.licenseremotefile
