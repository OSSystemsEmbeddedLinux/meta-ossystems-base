name: OE Lint

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  YOCTO_ENV_REV: e181bffff69b534899b1f6af4ca3195cbdf5a6bd # oelint-adv 9.11.3

jobs:
  oelint:
    runs-on: ubuntu-latest
    steps:
      - uses: ossystems/nix-actions@v1
        with:
          install-nix: true
          flake-check: false
          build-hosts: false
          build-devshells: false
          devshell: github:OSSystems/yocto-env.nix/${{ env.YOCTO_ENV_REV }}#lint
          cache-key-suffix: -yocto-env-${{ env.YOCTO_ENV_REV }}
          cache-save: ${{ github.event_name == 'push' }}
          run: ./contrib/oelint/run-oelint.sh
